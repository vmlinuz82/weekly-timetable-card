<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weekly Timetable Card — dev harness</title>
    <style>
      :root {
        --card-background-color: #ffffff;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --secondary-background-color: #f1f5f9;
        --divider-color: #e0e0e0;
        --primary-color: #03a9f4;
        --ha-card-border-radius: 12px;
        color-scheme: light;
        --page-background: #f4f6f8;
      }
      :root[data-theme="dark"] {
        --card-background-color: #1c1c1c;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --secondary-background-color: #282828;
        --divider-color: #3a3a3a;
        --primary-color: #03a9f4;
        color-scheme: dark;
        --page-background: #111315;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--page-background);
        color: var(--primary-text-color);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: end;
        margin-bottom: 24px;
        padding: 16px;
        background: var(--card-background-color);
        border-radius: 12px;
      }
      .controls label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: var(--secondary-text-color);
      }
      .controls select,
      .controls input {
        font: inherit;
        font-size: 13px;
        padding: 4px 6px;
      }
      #frame {
        max-width: 100%;
        margin: 0 auto;
        transition: width 120ms ease;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label>
        HA language
        <select name="hass-language">
          <option value="bg">bg</option>
          <option value="en-GB">en-GB</option>
          <option value="en-US">en-US</option>
          <option value="de">de</option>
        </select>
      </label>
      <label>
        Clock
        <select name="time-format">
          <option value="language">language</option>
          <option value="24">24</option>
          <option value="12">12</option>
          <option value="system">system</option>
        </select>
      </label>
      <label>
        Card language
        <select name="card-language">
          <option value="auto">auto</option>
          <option value="bg">bg</option>
          <option value="en">en</option>
        </select>
      </label>
      <label>
        Layout
        <select name="layout">
          <option value="blocks">blocks</option>
          <option value="grid">grid</option>
        </select>
      </label>
      <label>
        Days
        <select name="day-count">
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
        </select>
      </label>
      <label>
        Theme
        <select name="theme">
          <option value="light">light</option>
          <option value="dark">dark</option>
        </select>
      </label>
      <label>
        Width <span id="width-readout">900px</span>
        <input name="width" type="range" min="280" max="1400" step="10" value="900" />
      </label>
    </div>

    <div id="frame"><weekly-timetable-card></weekly-timetable-card></div>

    <script type="module" src="../dist/weekly-timetable-card.js"></script>
    <script type="module" src="./mock-hass.js"></script>
  </body>
</html>
